# Сборка Docker-образа на GitHub, а не на сервере: при каждом пуше в master
# образ публикуется в GitHub Container Registry, сервер его только скачивает
# (docker compose pull && docker compose up -d).
name: Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Слои (npm ci и т.п.) кэшируются между запусками.
          cache-from: type=gha
          cache-to: type=gha,mode=max
